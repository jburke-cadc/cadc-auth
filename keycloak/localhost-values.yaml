# Local overlay: ClusterIP + kubectl port-forward (no Traefik ingress).
#   kubectl -n keycloak port-forward svc/keycloak 8080:80
#   open http://localhost:8080/keycloak

ingress:
  enabled: false

service:
  type: ClusterIP

keycloak:
  hostname: localhost

auth:
  adminUser: admin
  adminPassword: pw-admin
