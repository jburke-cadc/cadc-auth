{{- if and .Values.ingress.enabled .Values.ingress.management.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "keycloak.fullname" . }}-management
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- with .Values.ingress.management.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.management.path }}
            pathType: {{ .Values.ingress.management.pathType }}
            backend:
              service:
                name: {{ include "keycloak.fullname" . }}
                port:
                  number: {{ .Values.service.managementPort }}
{{- end }}
