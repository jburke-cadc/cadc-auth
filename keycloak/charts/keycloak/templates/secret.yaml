{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "keycloak.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $adminPassB64 := "" }}
{{- if $existing }}
{{- $adminPassB64 = index $existing.data "KC_BOOTSTRAP_ADMIN_PASSWORD" }}
{{- else }}
{{- $adminPassB64 = (.Values.auth.adminPassword | default (randAlphaNum 32)) | b64enc }}
{{- end }}
{{- $dbPassB64 := "" }}
{{- if and .Values.database.enabled (not .Values.database.existingSecret) }}
  {{- if $existing }}
  {{- $dbPassB64 = index $existing.data "KC_DB_PASSWORD" }}
  {{- else }}
  {{- $dbPassB64 = (.Values.database.password | default (randAlphaNum 32)) | b64enc }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
data:
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ $adminPassB64 | quote }}
  {{- if and .Values.database.enabled (not .Values.database.existingSecret) }}
  KC_DB_PASSWORD: {{ $dbPassB64 | quote }}
  {{- end }}
{{- end }}
