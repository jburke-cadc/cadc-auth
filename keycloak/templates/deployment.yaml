apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "keycloak.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "keycloak.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - start
            {{- if .Values.realmImport.enabled }}
            - --import-realm
            {{- end }}
          env:
            {{- if .Values.keycloak.hostname }}
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            {{- end }}
            {{- if .Values.keycloak.hostnameAdmin }}
            - name: KC_HOSTNAME_ADMIN
              value: {{ .Values.keycloak.hostnameAdmin | quote }}
            {{- end }}
            {{- if .Values.keycloak.proxy }}
            - name: KC_PROXY
              value: {{ .Values.keycloak.proxy | quote }}
            {{- end }}
            {{- if .Values.keycloak.proxyHeaders }}
            - name: KC_PROXY_HEADERS
              value: {{ .Values.keycloak.proxyHeaders | quote }}
            {{- end }}
            {{- if .Values.keycloak.httpEnabled }}
            - name: KC_HTTP_ENABLED
              value: {{ .Values.keycloak.httpEnabled | quote }}
            {{- end }}
            {{- if .Values.keycloak.httpRelativePath }}
            - name: KC_HTTP_RELATIVE_PATH
              value: {{ .Values.keycloak.httpRelativePath | quote }}
            {{- end }}
            {{- if .Values.keycloak.hostnameStrict }}
            - name: KC_HOSTNAME_STRICT
              value: {{ .Values.keycloak.hostnameStrict | quote }}
            {{- end }}
            {{- if .Values.keycloak.healthEnabled }}
            - name: KC_HEALTH_ENABLED
              value: {{ .Values.keycloak.healthEnabled | quote }}
            {{- end }}
            {{- if .Values.keycloak.metricsEnabled }}
            - name: KC_METRICS_ENABLED
              value: {{ .Values.keycloak.metricsEnabled | quote }}
            {{- end }}
            {{- if .Values.database.enabled }}
            - name: KC_DB
              value: {{ .Values.database.vendor | quote }}
            - name: KC_DB_URL_HOST
              value: {{ required "database.host is required" .Values.database.host | quote }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.database.port | quote }}
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: KC_DB_SCHEMA
              value: {{ .Values.database.schema | quote }}
            - name: KC_DB_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.dbSecretName" . }}
                  key: {{ include "keycloak.dbPasswordKey" . }}
            {{- end }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.auth.adminUser | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.secretName" . }}
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            {{- with .Values.keycloak.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.keycloak.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.service.managementPort }}
              protocol: TCP
          {{- if .Values.keycloak.healthEnabled }}
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.realmImport.enabled }}
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          {{- end }}
      {{- if .Values.realmImport.enabled }}
      volumes:
        - name: realm-import
          {{- if .Values.realmImport.existingSecret }}
          secret:
            secretName: {{ include "keycloak.realmImportSourceName" . }}
          {{- else }}
          configMap:
            name: {{ include "keycloak.realmImportSourceName" . }}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
